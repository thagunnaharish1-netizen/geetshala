<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Missing - Geetshala</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-muted: #a7a7a7;
            --card-bg: #16161a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-container {
            background-color: var(--card-bg);
            padding: 60px 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a2a35;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }
        .icon-box {
            font-size: 4.5rem;
            color: var(--accent);
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 32px; }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .btn-home:hover { transform: scale(1.03); opacity: 0.9; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon-box"><i class="fa-solid fa-compact-disc"></i></div>
        <h1>404: Track Out of Bounds</h1>
        <p>The queue is empty here. The audio link or route you are searching for might have been shifted, renamed, or scratched off the record entirely.</p>
        <a href="/songs/" class="btn-home"><i class="fa-solid fa-house"></i> Back to Player</a>
    </div>
</body>
</html>
